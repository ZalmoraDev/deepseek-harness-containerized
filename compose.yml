name: dsh

services:
  searxng:
    image: searxng/searxng:latest
    container_name: dsh-searxng
    ports:
      - "127.0.0.1:3081:8080" # Also allow host access
    environment:
      - FORCE_OWNERSHIP=false
    restart: unless-stopped
    volumes:
      - ./config/searxng:/etc/searxng # Uses existing config. Sets .json format, needed by dsh plugin 'dsh-searxng'

  deepseek-harness:
    container_name: dsh-deepseek-harness
    build:
      context: .
      dockerfile: dsh.dockerfile
    ports:
      - "127.0.0.1:3080:3080"
    depends_on:
      - searxng
    environment:
      - SEARXNG_BASE_URL=http://searxng:8080
      - DSH_WEB_SEARCH_PROVIDER=searxng
      - PUID=${PUID:-1000} # TODO: Pass by executing user UID, not always 1000
      - PGID=${PGID:-1000} # TODO: Pass by executing user GID, not always 1000
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    volumes: # KEEP THE FIRST LINE. The rest `dsh volume` adds/removes automatically
      - ./config/dsh:/home/node/.dsh
      - ${HOME}/code/school/07-webdev2/memory-mall/backend/:/home/node/code/school/07-webdev2/memory-mall/backend/
      - ${HOME}/code/school/07-webdev2/memory-mall/compose.yml:/home/node/code/school/07-webdev2/memory-mall/compose.yml
      - ${HOME}/code/school/07-webdev2/memory-mall/docs/:/home/node/code/school/07-webdev2/memory-mall/docs/
      - ${HOME}/code/school/07-webdev2/memory-mall/.env.example:/home/node/code/school/07-webdev2/memory-mall/.env.example
      - ${HOME}/code/school/07-webdev2/memory-mall/.env.production:/home/node/code/school/07-webdev2/memory-mall/.env.production
      - ${HOME}/code/school/07-webdev2/memory-mall/.env.test:/home/node/code/school/07-webdev2/memory-mall/.env.test
      - ${HOME}/code/school/07-webdev2/memory-mall/express.dockerfile:/home/node/code/school/07-webdev2/memory-mall/express.dockerfile
      - ${HOME}/code/school/07-webdev2/memory-mall/frontend/:/home/node/code/school/07-webdev2/memory-mall/frontend/
      - ${HOME}/code/school/07-webdev2/memory-mall/.git/:/home/node/code/school/07-webdev2/memory-mall/.git/
      - ${HOME}/code/school/07-webdev2/memory-mall/.gitignore:/home/node/code/school/07-webdev2/memory-mall/.gitignore
      - ${HOME}/code/school/07-webdev2/memory-mall/.idea/:/home/node/code/school/07-webdev2/memory-mall/.idea/
      - ${HOME}/code/school/07-webdev2/memory-mall/nuxt.dockerfile:/home/node/code/school/07-webdev2/memory-mall/nuxt.dockerfile
      - ${HOME}/code/school/07-webdev2/memory-mall/.prettierrc:/home/node/code/school/07-webdev2/memory-mall/.prettierrc
      - ${HOME}/code/school/07-webdev2/memory-mall/README.md:/home/node/code/school/07-webdev2/memory-mall/README.md
      - ${HOME}/code/school/07-webdev2/memory-mall/shared/:/home/node/code/school/07-webdev2/memory-mall/shared/
      - ${HOME}/code/school/07-webdev2/memory-mall/.agents/:/home/node/code/school/07-webdev2/memory-mall/.agents/
