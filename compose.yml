name: dsh
services:
  deepseek-harness:
    container_name: dsh-deepseek-harness
    build:
      context: ./deepseek-harness
      dockerfile: ../dsh.dockerfile
      args:
        HOST_UID: ${HOST_UID}
    ports:
      - "127.0.0.1:3080:3080"
    restart: no

    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

    volumes:
      # DON'T TOUCH: Share host & container config, container conf not lost on volume removal
      - ${HOME}/.dsh:/root/.dsh

      # Add custom volumes here, e.g. per directory or individual project
      - ${HOME}/code/testing/:/root/code/testing/
      - ${HOME}/code/personal/deepseek-harnesss-containerized/:/root/code/personal/deepseek-harnesss-containerized/