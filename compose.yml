name: dsh
services:
  deepseek-harness:
    container_name: dsh-deepseek-harness
    build:
      context: ./deepseek-harness
      dockerfile: ../dsh.dockerfile
    ports:
      - "127.0.0.1:3080:3080"
    restart: no
    security_opt:
      - no-new-privileges:true
    volumes:
      - dsh_config:/root/.dsh
      - ${HOME}/code/testing:/root/code/testing
      - ${HOME}/code/school/07-webdev2/memory-mall:/root/code/school/07-webdev2/memory-mall
      - ${HOME}/code/personal/portfolio:/root/code/personal/portfolio
      - ${HOME}/containers/dsh/:/root/containers/dsh/

volumes:
  dsh_config: